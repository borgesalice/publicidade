<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel da turma</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ln:#d6d6d0;--ac:#2f6f5e;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--tx:#efefea;--mut:#a0a09a;--ln:#3a3a36;--ac:#7cc4ad;--on:#10201b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 20px}
label{display:block;margin:16px 0 6px;font-weight:600}
input[type=text],input[type=password],textarea{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px}
textarea{resize:vertical}
.chk{display:flex;gap:10px;align-items:center;font-weight:400}
.chk input{width:20px;height:20px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;margin-top:20px;background:var(--ac);color:var(--on);cursor:pointer}
button.sec{background:transparent;color:var(--mut);border:1px solid var(--ln);margin-top:32px}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.msg{margin-top:14px;color:var(--mut)}
p.ajuda{color:var(--mut);margin:0 0 8px}
</style>
</head>
<body>
<main>
<h1>Painel da turma</h1>

<section id="login" hidden>
  <p class="ajuda">Cole a chave do GitHub deste aparelho. Ela fica guardada só aqui.</p>
  <label for="tk">Chave</label>
  <input id="tk" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="entrar" type="button">Entrar</button>
  <p id="msgL" class="msg" role="status"></p>
</section>

<section id="painel" hidden>
  <form id="f">
    <label for="t">Título</label>
    <input id="t" type="text" required maxlength="120">
    <label for="x">Texto</label>
    <textarea id="x" rows="5"></textarea>
    <label class="chk"><input id="i" type="checkbox"> Importante (destaque no topo)</label>
    <button id="salvar" type="submit">Publicar aviso</button>
    <p id="msg" class="msg" role="status"></p>
  </form>
  <button id="sair" class="sec" type="button">Sair deste aparelho</button>
</section>
</main>

<script>
const OWNER = 'borgesalice', REPO = 'publicidade', PATH = 'avisos.json';
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
const KEY = 'turma_chave';
const $ = id => document.getElementById(id);

let token = null;
try { token = localStorage.getItem(KEY); } catch {}

const hd = () => ({ Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' });
const b64e = s => { let b = ''; new TextEncoder().encode(s).forEach(c => b += String.fromCharCode(c)); return btoa(b); };
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));

function mostrar() {
  $('login').hidden = !!token;
  $('painel').hidden = !token;
}

$('entrar').onclick = async () => {
  const t = $('tk').value.trim();
  if (!t) return;
  $('msgL').textContent = 'Verificando…';
  try {
    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, {
      headers: { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json' }
    });
    if (!r.ok) throw r.status;
    token = t;
    try { localStorage.setItem(KEY, t); } catch {}
    $('tk').value = '';
    $('msgL').textContent = '';
    mostrar();
  } catch (e) {
    $('msgL').textContent = e === 401
      ? 'Chave inválida ou vencida. Gere outra no GitHub.'
      : 'Não consegui verificar a chave. Confira se ela tem acesso ao repositório.';
  }
};

$('sair').onclick = () => {
  token = null;
  try { localStorage.removeItem(KEY); } catch {}
  $('msg').textContent = '';
  mostrar();
};

$('f').onsubmit = async e => {
  e.preventDefault();
  const btn = $('salvar');
  btn.disabled = true;
  $('msg').textContent = 'Publicando…';
  try {
    let sha, dados = { avisos: [] };
    const g = await fetch(API + '?t=' + Date.now(), { headers: hd(), cache: 'no-store' });
    if (g.ok) {
      const j = await g.json();
      sha = j.sha;
      dados = JSON.parse(b64d(j.content));
      if (!Array.isArray(dados.avisos)) dados.avisos = [];
    } else if (g.status !== 404) {
      throw g.status;
    }
    const titulo = $('t').value.trim();
    dados.avisos.push({
      id: crypto.randomUUID(),
      titulo,
      texto: $('x').value.trim(),
      importante: $('i').checked,
      criadoEm: new Date().toISOString()
    });
    const body = {
      message: 'Novo aviso: ' + titulo.slice(0, 60),
      content: b64e(JSON.stringify(dados, null, 2) + '\n')
    };
    if (sha) body.sha = sha;
    const p = await fetch(API, {
      method: 'PUT',
      headers: { ...hd(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!p.ok) throw p.status;
    $('f').reset();
    $('msg').textContent = 'Aviso publicado. Ele aparece no site em alguns minutos.';
  } catch (err) {
    if (err === 401) {
      token = null;
      try { localStorage.removeItem(KEY); } catch {}
      mostrar();
      $('msgL').textContent = 'A chave venceu ou foi cancelada. Cole uma nova.';
    } else if (err === 403 || err === 404) {
      $('msg').textContent = 'A chave não tem permissão para gravar neste repositório. Confira a permissão Contents: leitura e escrita.';
    } else if (err === 409 || err === 422) {
      $('msg').textContent = 'O arquivo mudou enquanto você publicava. Toque em Publicar aviso de novo.';
    } else {
      $('msg').textContent = 'Não foi possível publicar. Verifique a conexão e tente de novo.';
    }
  }
  btn.disabled = false;
};

mostrar();
</script>
</body>
</html>
